name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  livekit-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install real optional LiveKit dependencies
        run: |
          npm install --save-dev --package-lock=false @livekit/agents@1.5.0 @livekit/rtc-node@0.13.35
          node -e "require.resolve('@livekit/rtc-node')"
      - run: npm run build
      - name: Real 8kHz and 16kHz media contract (no mocks)
        run: node verify/livekit-media.mjs
